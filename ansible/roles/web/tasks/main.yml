---
# web01: Nginx 설치 및 서비스 기동
- name: Nginx 설치
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Nginx 서비스 시작 및 활성화
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

- name: 방화벽에 http 서비스 허용
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
